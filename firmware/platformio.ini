[env:native]
platform = native
test_framework = unity
test_build_src = no

[env:esp32dev]
; Confirmed development board: ESP32 DevKit V1.
; Exact ESP chip/module and hardware revision remain unknown.
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
test_framework = unity
test_build_src = no

[env:esp32dev-sim]
extends = env:esp32dev
build_flags = -DFIKK_DEV_SIMULATION=1
